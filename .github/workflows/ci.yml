
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: consultation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d consultation_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/consultation_ci?schema=public
      JWT_SECRET: ci_test_secret_long_enough_for_testing_123456

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
      - run: npx prisma generate --config ./prisma7.config.ts
      - run: npx prisma migrate deploy --config ./prisma7.config.ts
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint
